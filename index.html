<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mindbuy - Consumo Responsable</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen flex flex-col justify-between p-6 md:p-12">

    <div class="max-w-xl mx-auto w-full bg-white p-8 rounded-xl shadow-sm border border-gray-100 my-auto">
        
        <header class="mb-10 text-center">
            <h1 class="text-3xl font-light tracking-widest text-gray-900">MINDBUY</h1>
            <p class="text-xs text-gray-400 mt-2 uppercase tracking-wider">Identifica tus hábitos de compra digital</p>
        </header>

        <main>
            <section id="vista-auth" class="space-y-4">
                <h2 class="text-sm font-medium text-gray-700 uppercase tracking-wider text-center mb-6">Ingreso al Estudio</h2>
                
                <div class="space-y-3">
                    <div>
                        <label class="block text-xs text-gray-400 uppercase tracking-wider mb-1">Correo Electrónico</label>
                        <input type="email" id="auth-email" placeholder="ejemplo@correo.com" class="w-full bg-gray-50 border border-gray-200 text-sm rounded-lg p-2.5 focus:ring-1 focus:ring-black focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs text-gray-400 uppercase tracking-wider mb-1">Contraseña</label>
                        <input type="password" id="auth-password" placeholder="Mínimo 6 caracteres" class="w-full bg-gray-50 border border-gray-200 text-sm rounded-lg p-2.5 focus:ring-1 focus:ring-black focus:outline-none">
                    </div>
                </div>

                <p id="auth-error" class="text-red-500 text-xs text-center hidden"></p>
                <p id="auth-success" class="text-green-600 text-xs text-center hidden"></p>

                <div class="pt-4 space-y-2">
                    <button type="button" onclick="iniciarSesion()" class="w-full bg-black text-white text-sm tracking-wider uppercase py-3 rounded-lg hover:bg-gray-800 transition">
                        Iniciar Sesión
                    </button>
                    <button type="button" onclick="registrarUsuario()" class="w-full bg-white text-gray-600 border border-gray-200 text-sm tracking-wider uppercase py-3 rounded-lg hover:bg-gray-50 transition">
                        Crear Cuenta Nueva
                    </button>
                </div>
            </section>

            <section id="vista-dashboard" class="space-y-6 hidden">
                <div class="text-center py-4 border-b border-gray-100">
                    <p class="text-sm text-gray-500">Bienvenido(a) al panel de control,</p>
                    <p id="user-display-email" class="text-base font-medium text-gray-900 font-mono mt-1"></p>
                </div>

                <div class="bg-gray-50 p-5 rounded-lg border border-gray-100 text-center space-y-2">
                    <h3 class="text-sm font-medium text-gray-800 uppercase tracking-wider">Test de Hábitos de Compra</h3>
                    <p class="text-xs text-gray-400">Esta evaluación toma alrededor de 3 minutos y mide tus conductas en entornos digitales.</p>
                </div>

                <div class="pt-2 space-y-2">
                    <button type="button" onclick="mostrarTest()" class="w-full bg-black text-white text-sm tracking-wider uppercase py-3 rounded-lg hover:bg-gray-800 transition shadow-md">
                        Comenzar Evaluación
                    </button>
                    <button type="button" onclick="cerrarSesion()" class="w-full bg-gray-100 text-gray-500 text-xs tracking-wider uppercase py-2 rounded-lg hover:bg-gray-200 transition">
                        Cerrar Sesión
                    </button>
                </div>
            </section>

            <section id="vista-test" class="hidden">
                <div id="preguntas-container" class="space-y-6">
                    <p id="loading-text" class="text-gray-400 text-sm text-center animate-pulse">Conectando con la base de datos...</p>
                </div>

                <div class="pt-8 space-y-2">
                    <button type="button" onclick="enviarResultados()" class="w-full bg-black text-white text-sm tracking-wider uppercase py-3 rounded-lg hover:bg-gray-800 transition shadow-md">
                        Finalizar Evaluación
                    </button>
                    <button type="button" onclick="volverAlDashboard()" class="w-full bg-white text-gray-400 text-xs tracking-wider uppercase py-2 hover:text-gray-600 transition text-center block">
                        Volver al Panel
                    </button>
                </div>
            </section>
        </main>
    </div>

    <footer class="text-center text-xs text-gray-400 mt-8">
        Proyecto de Investigación — Bogotá, D.C.
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        const SUPABASE_URL = 'https://qrwahxiakrrdzoizdyab.supabase.co'; 
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFyd2FoeGlha3JyZHpvaXpkeWFiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg3Njk0MDcsImV4cCI6MjA5NDM0NTQwN30.c-4IwsN44pAVd05PU6IavPeDOEm0Irb_kopXrOzS1Gc';
        
        let supabaseClient;
        let usuarioActual = null;

        try {
            supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        } catch (e) {
            alert("Error al conectar las llaves de Supabase: " + e.message);
        }

        function irAVista(idVista) {
            document.getElementById('vista-auth').classList.add('hidden');
            document.getElementById('vista-dashboard').classList.add('hidden');
            document.getElementById('vista-test').classList.add('hidden');
            document.getElementById(idVista).classList.remove('hidden');
        }

        // --- REGISTRO BLINDADO CON ALERTAS DE CONTROL ---
        async function registrarUsuario() {
            try {
                const email = document.getElementById('auth-email').value.trim();
                const password = document.getElementById('auth-password').value;
                const errorTxt = document.getElementById('auth-error');
                const successTxt = document.getElementById('auth-success');
                
                errorTxt.classList.add('hidden');
                successTxt.classList.add('hidden');

                if(!email || !password) {
                    errorTxt.textContent = "Por favor completa todos los campos.";
                    errorTxt.classList.remove('hidden');
                    return;
                }

                if(password.length < 6) {
                    errorTxt.textContent = "La contraseña debe tener mínimo 6 caracteres.";
                    errorTxt.classList.remove('hidden');
                    return;
                }

                // Llamada a Supabase
                const { data, error } = await supabaseClient.auth.signUp({ email, password });

                if (error) {
                    errorTxt.textContent = `Error de Supabase: ${error.message}`;
                    errorTxt.classList.remove('hidden');
                    alert("Supabase rechazó el registro: " + error.message);
                } else if (data.user && data.session === null) {
                    successTxt.textContent = "¡Usuario registrado! Por seguridad de Supabase, revisa tu correo electrónico para confirmar la cuenta.";
                    successTxt.classList.remove('hidden');
                    alert("¡Cuenta pre-creada! Te enviamos un correo de confirmación. Actívalo para poder iniciar sesión.");
                } else {
                    successTxt.textContent = "¡Cuenta creada con éxito! Ya puedes iniciar sesión.";
                    successTxt.classList.remove('hidden');
                    document.getElementById('auth-password').value = "";
                    alert("¡Usuario creado con éxito!");
                }
            } catch (errorGeneral) {
                alert("Ocurrió un error crítico en el código del botón: " + errorGeneral.message);
            }
        }

        // --- INICIO DE SESIÓN ---
        async function iniciarSesion() {
            try {
                const email = document.getElementById('auth-email').value.trim();
                const password = document.getElementById('auth-password').value;
                const errorTxt = document.getElementById('auth-error');
                const successTxt = document.getElementById('auth-success');
                
                errorTxt.classList.add('hidden');
                successTxt.classList.add('hidden');

                const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });

                if (error) {
                    errorTxt.textContent = "Error: Credenciales incorrectas o correo sin confirmar.";
                    errorTxt.classList.remove('hidden');
                } else {
                    usuarioActual = data.user;
                    document.getElementById('user-display-email').textContent = usuarioActual.email;
                    irAVista('vista-dashboard');
                }
            } catch (err) {
                alert("Error al iniciar sesión: " + err.message);
            }
        }

        async function cerrarSesion() {
            await supabaseClient.auth.signOut();
            usuarioActual = null;
            document.getElementById('auth-email').value = "";
            document.getElementById('auth-password').value = "";
            irAVista('vista-auth');
        }

        function mostrarTest() {
            irAVista('vista-test');
            obtenerPreguntas();
        }

        function volverAlDashboard() {
            irAVista('vista-dashboard');
        }

        // --- OBTENER PREGUNTAS (CORREGIDO CON TU COLUMNA 'identificación') ---
        async function obtenerPreguntas() {
            const container = document.getElementById('preguntas-container');
            container.innerHTML = '<p class="text-gray-400 text-sm text-center animate-pulse">Conectando con la base de datos...</p>';

            const { data: preguntas, error } = await supabaseClient
                .from('preguntas')
                .select('*');

            if (error) {
                container.innerHTML = `<p class="text-red-500 text-center text-sm">Error al conectar con las tablas de Supabase.</p>`;
                console.error(error);
                return;
            }

            container.innerHTML = ""; 

            if (preguntas && preguntas.length > 0) {
                preguntas.forEach((p, index) => {
                    const div = document.createElement('div');
                    div.className = "border-b border-gray-100 pb-6";

                    const label = document.createElement('label');
                    label.className = "block text-sm font-medium text-gray-700 mb-2";
                    label.textContent = `${index + 1}. ${p.texto_pregunta}`;

                    const select = document.createElement('select');
                    select.className = "w-full bg-gray-50 border border-gray-200 text-sm rounded-lg p-2.5 text-gray-600 focus:ring-1 focus:ring-black focus:outline-none";
                    
                    const opciones = [
                        { text: 'Nunca', value: '1' },
                        { text: 'A veces', value: '2' },
                        { text: 'Frecuentemente', value: '3' },
                        { text: 'Siempre', value: '4' }
                    ];

                    opciones.forEach(opt => {
                        const o = document.createElement('option');
                        o.value = opt.value;
                        o.textContent = opt.text;
                        select.appendChild(o);
                    });

                    const badge = document.createElement('span');
                    badge.className = "text-[10px] bg-gray-100 text-gray-500 px-2 py-0.5 rounded mt-2 inline-block uppercase tracking-wide font-mono";
                    badge.textContent = p.categorías || "Métrica"; // Ajustado a tu columna 'categorías'

                    div.appendChild(label);
                    div.appendChild(select);
                    div.appendChild(badge);
                    container.appendChild(div);
                });
            } else {
                container.innerHTML = `<p class="text-amber-500 text-center text-sm">No se encontraron preguntas en la tabla.</p>`;
            }
        }

        function enviarResultados() {
            alert(`¡Test completado, ${usuarioActual.email}! Gracias por participar en el estudio de Mindbuy.`);
            irAVista('vista-dashboard');
        }

        window.onload = function() {
            irAVista('vista-auth');
        };
    </script>
</body>
</html>
