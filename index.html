<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mindbuy - Consumo Responsable</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen flex flex-col justify-between p-6 md:p-12">

    <div class="max-w-xl mx-auto w-full bg-white p-8 rounded-xl shadow-sm border border-gray-100">
        <header class="mb-10 text-center">
            <h1 class="text-3xl font-light tracking-widest text-gray-900">MINDBUY</h1>
            <p class="text-xs text-gray-400 mt-2 uppercase tracking-wider">Identifica tus hábitos de compra digital</p>
        </header>

        <main>
            <div id="preguntas-container" class="space-y-6">
                <p class="text-gray-400 text-sm text-center animate-pulse">Conectando con la base de datos...</p>
            </div>

            <button onclick="enviarResultados()" class="w-full mt-8 bg-black text-white text-sm tracking-wider uppercase py-3 rounded-lg hover:bg-gray-800 transition shadow-md">
                Finalizar Evaluación
            </button>
        </main>
    </div>

    <footer class="text-center text-xs text-gray-400 mt-8">
        Proyecto de Investigación — Bogotá, D.C.
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        // === REEMPLAZA ESTOS DATOS CON TUS LLAVES REALES DE SUPABASE ===
        const SUPABASE_URL = 'sb_publishable_XSIjXMnLdTcVsgpFEp48KQ_AXD4VC5O';
        const SUPABASE_KEY = 'sb_secret_95lBPg0ryuO_f7SRajKJXg_oqltj7hI';
        
        let supabaseClient;

        // Inicialización segura de Supabase
        try {
            supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        } catch (e) {
            console.error("Error al inicializar Supabase:", e);
            document.getElementById('preguntas-container').innerHTML = `<p class="text-red-500 text-center text-sm">Error crítico: No se pudo cargar el cliente de la base de datos.</p>`;
        }

        // Función para leer las preguntas desde Supabase
        async function obtenerPreguntas() {
            if (!supabaseClient) return;

            const { data: preguntas, error } = await supabaseClient
                .from('preguntas')
                .select('*');

            if (error) {
                document.getElementById('preguntas-container').innerHTML = `<p class="text-red-500 text-center text-sm">Error al conectar con las tablas de Supabase.</p>`;
                console.error(error);
                return;
            }

            const container = document.getElementById('preguntas-container');
            
            if (preguntas && preguntas.length > 0) {
                container.innerHTML = preguntas.map((p, index) => `
                    <div class="border-b border-gray-100 pb-4">
                        <label class="block text-sm font-medium text-gray-700 mb-2">${index + 1}. ${p.texto_pregunta}</label>
                        <select class="w-full bg-gray-50 border border-gray-200 text-sm rounded-lg p-2.5 text-gray-600 focus:ring-1 focus:ring-black focus:outline-none">
                            <option value="1">Nunca</option>
                            <option value="2">A veces</option>
                            <option value="3">Frecuentemente</option>
                            <option value="4">Siempre</option>
                        </select>
                        <span class="text-[10px] bg-gray-100 text-gray-500 px-2 py-0.5 rounded mt-2 inline-block uppercase tracking-wide font-mono">${p.categoria}</span>
                    </div>
                `).join('');
            } else {
                container.innerHTML = `<p class="text-amber-500 text-center text-sm">No se encontraron preguntas en la tabla de Supabase.</p>`;
            }
        }

        function enviarResultados() {
            alert("¡Test completado! Gracias por participar en el estudio de Mindbuy.");
        }

        // Ejecutar la carga cuando todo el HTML esté listo
        window.onload = obtenerPreguntas;
    </script>
</body>
</html>
