<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mindbuy - Consumo Responsable</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen flex flex-col justify-between p-6 md:p-12">

    <div class="max-w-xl mx-auto w-full bg-white p-8 rounded-xl shadow-sm border border-gray-100">
        <header class="mb-10 text-center">
            <h1 class="text-3xl font-light tracking-widest text-gray-900">MINDBUY</h1>
            <p class="text-xs text-gray-400 mt-2 uppercase tracking-wider">Identifica tus hábitos de compra digital</p>
        </header>

        <main>
            <div id="preguntas-container" class="space-y-6">
                <p id="loading-text" class="text-gray-400 text-sm text-center animate-pulse">Conectando con la base de datos...</p>
            </div>

            <button onclick="enviarResultados()" class="w-full mt-8 bg-black text-white text-sm tracking-wider uppercase py-3 rounded-lg hover:bg-gray-800 transition shadow-md">
                Finalizar Evaluación
            </button>
        </main>
    </div>

    <footer class="text-center text-xs text-gray-400 mt-8">
        Proyecto de Investigación — Bogotá, D.C.
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        // === REEMPLAZA ESTOS DATOS CON TUS LLAVES REALES DE SUPABASE ===
        const SUPABASE_URL = 'AQUÍ_PEGA_TU_PROJECT_URL';
        const SUPABASE_KEY = 'AQUÍ_PEGA_TU_ANON_PUBLIC_KEY';
        
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function obtenerPreguntas() {
            const { data: preguntas, error } = await supabaseClient
                .from('preguntas')
                .select('*');

            if (error) {
                document.getElementById('preguntas-container').innerHTML = `<p class="text-red-500 text-center text-sm">Error al conectar con las tablas de Supabase.</p>`;
                console.error(error);
                return;
            }

            const container = document.getElementById('preguntas-container');
            container.innerHTML = ""; // Limpiamos el texto de carga

            if (preguntas && preguntas.length > 0) {
                preguntas.forEach((p, index) => {
                    // Creamos el contenedor de la pregunta
                    const div = document.createElement('div');
                    div.className = "border-b border-gray-100 pb-6";

                    // Etiqueta de la pregunta
                    const label = document.createElement('label');
                    label.className = "block text-sm font-medium text-gray-700 mb-2";
                    label.textContent = `${index + 1}. ${p.texto_pregunta}`;

                    // Selector de opciones
                    const select = document.createElement('select');
                    select.className = "w-full bg-gray-50 border border-gray-200 text-sm rounded-lg p-2.5 text-gray-600 focus:ring-1 focus:ring-black focus:outline-none";
                    
                    const opciones = [
                        { text: 'Nunca', value: '1' },
                        { text: 'A veces', value: '2' },
                        { text: 'Frecuentemente', value: '3' },
                        { text: 'Siempre', value: '4' }
                    ];

                    opciones.forEach(opt => {
                        const o = document.createElement('option');
                        o.value = opt.value;
                        o.textContent = opt.text;
                        select.appendChild(o);
                    });

                    // Etiqueta de categoría (Métrica de la tesis)
                    const badge = document.createElement('span');
                    badge.className = "text-[10px] bg-gray-100 text-gray-500 px-2 py-0.5 rounded mt-2 inline-block uppercase tracking-wide font-mono";
                    badge.textContent = p.categoria;

                    // Estructuramos los elementos
                    div.appendChild(label);
                    div.appendChild(select);
                    div.appendChild(badge);
                    container.appendChild(div);
                });
            } else {
                container.innerHTML = `<p class="text-amber-500 text-center text-sm">No se encontraron preguntas en la tabla.</p>`;
            }
        }

        function enviarResultados() {
            alert("¡Test completado! Gracias por participar en el estudio de Mindbuy.");
        }

        window.onload = obtenerPreguntas;
    </script>
</body>
</html>

        // Ejecutar la carga cuando todo el HTML esté listo
        window.onload = obtenerPreguntas;
    </script>
</body>
</html>
